<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NISCAYA MAKASSAR — Teknisi</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:#eef1f6;color:#14161f}
button,input,textarea,select{font:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 90px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.brand{font-weight:800;font-size:17px}.brand i{font-style:normal;color:#1a5fd6}
.who{font-size:12.5px;color:#5b6475;text-align:right}
.btn{border:1.5px solid #14161f;background:#fff;color:#14161f;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn.dark{background:#14161f;color:#fff}.btn.green{background:#1f845a;border-color:#1f845a;color:#fff}.btn.red{background:#fff;border-color:#c9372c;color:#c9372c}
.btn.sm{padding:6px 12px;font-size:12.5px}.btn:disabled{opacity:.5}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 24px -16px rgba(20,45,95,.35);margin-bottom:12px}
.login{max-width:380px;margin:12vh auto 0}
.login h1{font-size:22px;margin:0 0 4px}.dim{color:#5b6475;font-size:13px}
label{display:block;font-size:12.5px;font-weight:700;margin:12px 0 5px;color:#3b4252}
input,textarea,select{width:100%;padding:11px 12px;border:1.5px solid #d6dbe6;border-radius:12px;background:#fff}
textarea{min-height:70px;resize:vertical}
.err{color:#c9372c;font-size:13px;margin-top:10px;min-height:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:14px;padding:11px 12px}.stat b{display:block;font-size:19px}.stat span{font-size:11.5px;color:#5b6475}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}
.tab{border:0;background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer}
.tab.on{background:#14161f;color:#fff}
.job h3{margin:0 0 4px;font-size:15.5px}
.badge{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:4px 9px;color:#fff}
.b-Antri{background:#8590a2}.b-Dikerjakan{background:#cf9f02}.b-Selesai{background:#1f845a}.b-Gagal{background:#c9372c}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.spec{font-size:12.5px;color:#3b4252;margin:6px 0}
.note{background:#f4f6fb;border-radius:12px;padding:9px 11px;font-size:13px;margin:8px 0}
.late{color:#c9372c;font-weight:700}
.parts .pr{display:grid;grid-template-columns:1fr 120px 36px;gap:6px;margin-bottom:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.empty{text-align:center;color:#5b6475;padding:30px 10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#14161f;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.toast.on{opacity:1}
details summary{cursor:pointer;font-weight:700;font-size:13px;margin-top:8px}
/*CB-LOGIN*/
#loginOverlay,#tLogin{background:#c9c9d6;font-family:Inter,'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif;color:#1b1d36}
.cb-page{width:calc(100% - 48px);max-width:1080px;min-height:min(640px,calc(100% - 48px));margin:24px auto;display:grid;grid-template-columns:1.12fr 1fr;background:#fff;box-shadow:0 30px 80px -20px rgba(30,30,70,.35);border-radius:4px;overflow:hidden}
#loginOverlay{display:flex;align-items:center}
.cb-art{background:#f6f7fd;position:relative;overflow:hidden;min-height:560px}
.cb-fl{position:absolute;background:#fff;box-shadow:0 12px 30px -10px rgba(40,40,90,.22);border-radius:4px;animation:cbBob 6s ease-in-out infinite;z-index:3}
@keyframes cbBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.cb-lap{position:absolute;left:50%;top:50%;width:300px;transform:translate(-50%,-46%)}
.cb-lid{background:#2b2d36;border-radius:10px 10px 2px 2px;padding:9px 9px 12px;transform:perspective(700px) rotateX(8deg);transform-origin:bottom}
.cb-scr{background:#fff;height:172px;border-radius:2px;padding:9px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.cb-st{display:flex;gap:5px;align-items:center}.cb-st b{font-size:8px;letter-spacing:.3px;white-space:nowrap}.cb-st b span{color:#1a33ff}
.cb-pl{height:6px;border-radius:3px;background:#e8eaf6}
.cb-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;flex:1}
.cb-col{background:#f2f4fb;border-radius:3px;padding:4px;display:flex;flex-direction:column;gap:4px}
.cb-col i{font-style:normal;font-size:6px;font-weight:700;color:#7a7f9a}
.cb-cr{background:#fff;border-radius:2px;height:18px;box-shadow:0 1px 2px rgba(0,0,0,.08);position:relative}
.cb-cr:after{content:"";position:absolute;left:4px;top:5px;width:60%;height:3px;border-radius:2px;background:#d7dbee}
.cb-cr.b:before{content:"";position:absolute;left:4px;top:11px;width:30%;height:3px;border-radius:2px;background:#1a33ff}
.cb-base{height:150px;margin:-2px 0 0 -6%;width:112%;background:linear-gradient(#c8cad2,#a7aab4);clip-path:polygon(5% 0,95% 0,100% 100%,0 100%);border-radius:0 0 10px 10px;position:relative}
.cb-keys{position:absolute;left:12%;right:12%;top:12px;height:62px;background:repeating-linear-gradient(90deg,#2f313a 0 14px,transparent 14px 17px);-webkit-mask:repeating-linear-gradient(#000 0 11px,transparent 11px 14px);mask:repeating-linear-gradient(#000 0 11px,transparent 11px 14px)}
.cb-pad{position:absolute;left:36%;right:36%;bottom:16px;height:44px;border-radius:5px;background:#b9bcc5;box-shadow:inset 0 0 0 1px #9da0aa}
.cb-sold{left:13%;top:9%;width:122px;padding:12px 10px;text-align:center;animation-delay:-1s}
.cb-sold .ic{width:26px;height:30px;margin:0 auto 6px;border:2px solid #39c486;border-radius:3px;display:flex;align-items:center;justify-content:center;color:#39c486;font-weight:800;font-size:13px}
.cb-sold b{font-size:11px;display:block}.cb-sold small{font-size:8px;color:#7a7f9a;display:block;margin:3px 0 7px}.cb-sold em{display:block;height:9px;background:#1a33ff;border-radius:2px}
.cb-spec{left:6%;top:42%;display:flex;gap:8px;align-items:center;padding:9px 12px;font-size:10px;font-weight:600;animation-delay:-3s}
.cb-doc{width:14px;height:17px;border:1.5px solid #b8bcd3;border-radius:2px;flex:none}
.cb-qc{right:7%;bottom:15%;width:132px;padding:10px;font-size:8px;animation-delay:-2s}
.cb-qc .t{font-weight:700;font-size:9px;display:flex;gap:6px;align-items:center}
.cb-qc .r{display:flex;justify-content:space-between;color:#7a7f9a;margin-top:4px}.cb-qc .r b{color:#1b1d36}
.cb-clock{position:absolute;left:14%;bottom:9%;width:64px;height:64px;border-radius:50%;border:2px solid #1b1d36;background:conic-gradient(#7ee0b4 0 38%,#fff 38%);animation:cbBob 7s ease-in-out infinite -4s}
.cb-clock:before,.cb-clock:after{content:"";position:absolute;left:50%;top:50%;height:2px;background:#1b1d36;transform-origin:0 50%;border-radius:2px}
.cb-clock:before{width:22px;transform:rotate(-30deg)}.cb-clock:after{width:15px;transform:rotate(160deg)}
.cb-bd{position:absolute;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #c9cdf5;background:#eef0ff;color:#1a33ff;font-size:15px;animation:cbBob 5s ease-in-out infinite}
.cb-b1{left:9%;top:61%;animation-delay:-2.5s}.cb-b2{right:9%;top:46%;animation-delay:-1.2s}
.cb-rk{position:absolute;left:43%;top:11%;color:#1a33ff;font-size:16px;transform:rotate(-12deg)}
.cb-ring{position:absolute;right:9%;top:8%;width:118px;height:118px;border-radius:50%;background:#fff;border:2px solid #1b1d36;box-shadow:6px 6px 0 -1px #c9cdf5;display:flex;align-items:center;justify-content:center;text-align:center;animation:cbBob 8s ease-in-out infinite -5s}
.cb-ring b{font-size:22px;line-height:1;color:#1a33ff}.cb-ring small{display:block;font-size:9px;color:#7a7f9a;margin-top:4px}
.cb-tag{position:absolute;left:28px;bottom:22px;margin:0;font-size:11px;color:#7a7f9a}
.cb-side{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 36px;gap:20px}
.cb-brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:.2px;color:#1b1d36}
.cb-brand img{width:26px;height:26px;border-radius:6px;object-fit:cover}
.cb-brand .lg{width:24px;height:24px;border-radius:5px;background:#1a33ff;display:flex;align-items:center;justify-content:center}
.cb-brand .lg:after{content:"";width:12px;height:8px;border:2px solid #fff;border-bottom-width:3px;border-radius:2px}
.cb-brand span span{color:#1a33ff}
.cb-h1{font-size:23px;font-weight:600;margin:0;color:#1b1d36}
.cb-card{width:100%;max-width:340px;background:#fff;border:1px solid #f0f1f7;box-shadow:0 10px 40px -18px rgba(40,40,90,.25);padding:24px 22px}
.cb-seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid #1a33ff;border-radius:3px;overflow:hidden;margin-bottom:16px}
.cb-seg>*{border:0;background:#fff;color:#1a33ff;font-family:inherit;font-weight:600;font-size:13px;line-height:1;padding:10px;cursor:pointer;text-align:center;text-decoration:none}
.cb-seg>.on{background:#1a33ff;color:#fff}
.cb-foot{font-size:12.5px;color:#7a7f9a;margin:0;text-align:center}
.cb-foot button{background:none;border:0;padding:0;color:#1a33ff;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer}
.cb-foot button:hover{text-decoration:underline}
@media(max-width:820px){
  .cb-page{width:100%;min-height:100%;margin:0;grid-template-columns:1fr;border-radius:0;box-shadow:none}
  #loginOverlay{display:block;background:#fff}
  .cb-art{min-height:0;height:240px}
  .cb-lap{transform:translate(-50%,-50%) scale(.6)}
  .cb-ring{width:74px;height:74px;top:7%;right:6%}.cb-ring b{font-size:16px}.cb-ring small{font-size:8px}
  .cb-qc,.cb-spec,.cb-sold,.cb-clock,.cb-tag,.cb-rk{display:none}
  .cb-b1{left:8%;top:40%}.cb-b2{right:8%;top:62%}
  .cb-side{padding:26px 18px 40px}
}

#tLogin{position:fixed;inset:0;z-index:50;overflow:auto;display:flex;align-items:center}
#tLogin .cb-card label{font-size:11.5px;font-weight:500;color:#7a7f9a;margin:12px 0 5px}
#tLogin .cb-card input{height:44px;border:1px solid #e3e5f0;border-radius:3px;font-size:14px}
#tLogin .cb-card input:focus{outline:none;border-color:#1a33ff;box-shadow:0 0 0 3px rgba(26,51,255,.12)}
#tLogin .cb-ttl{font-size:17px;font-weight:600;text-align:center;margin:0 0 4px}
#tLogin .cb-sub{font-size:12px;color:#7a7f9a;text-align:center;margin:0 0 4px;line-height:1.5}
#tLogin .cb-go{width:100%;height:44px;margin-top:6px;border:0;border-radius:3px;background:#1a33ff;color:#fff;font-weight:600;font-size:14px;cursor:pointer}
#tLogin .cb-go:hover{background:#1226d6}#tLogin .cb-go:disabled{opacity:.6}
@media(max-width:820px){#tLogin{display:block;background:#fff}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Memuat…</div></div>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = v => (v===undefined||v===null)?'':String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp ' + (Number(n)||0).toLocaleString('id-ID');
const tgl = t => t ? new Date(t*1000).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '-';
let ME = null, JOBS = [], TAB = 'aktif', VER = 0, OPEN = new Set();
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2600); }
async function api(path, body){
  const o = body===undefined ? {cache:'no-store',credentials:'same-origin'} : {method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)};
  const r = await fetch(path, o); const j = await r.json().catch(()=>({}));
  if(r.status===401 && path!=='/tapi/login'){ ME=null; renderLogin('Sesi berakhir, silakan masuk lagi'); throw new Error('401'); }
  if(!r.ok) throw new Error(j.error || 'Gagal ('+r.status+')');
  return j;
}
function jam(j){ if(!j.mulai) return null; return ((j.selesai || Date.now()/1000) - j.mulai)/3600; }
function fmtJam(h){ if(h===null) return '-'; return h<1 ? Math.round(h*60)+' mnt' : h.toFixed(1).replace('.',',')+' jam'; }
function totalParts(j){ return (j.parts||[]).reduce((a,p)=>a+(Number(p.nominal)||0),0); }

function renderLogin(msg){
  $('#app').innerHTML = `<div id="tLogin"><div class="cb-page">
    <section class="cb-art" aria-hidden="true"><div class="cb-fl cb-sold"><div class="ic">✓</div><b>Terjual</b><small>ThinkPad T480 · i5 · 8GB</small><em></em></div><span class="cb-rk">➶</span><div class="cb-ring"><div><b>✓</b><small>QC tercatat<br>rapi</small></div></div><div class="cb-fl cb-spec"><span class="cb-doc"></span>Garansi toko 30 hari</div><span class="cb-bd cb-b1">👍</span><span class="cb-bd cb-b2">⚙</span><div class="cb-lap"><div class="cb-lid"><div class="cb-scr"><div class="cb-st"><b>NISCAYA <span>MAKASSAR</span></b><div class="cb-pl" style="flex:1"></div><div class="cb-pl" style="width:24px;background:#1a33ff"></div></div><div class="cb-cols"><div class="cb-col"><i>READY</i><div class="cb-cr b"></div><div class="cb-cr"></div><div class="cb-cr"></div></div><div class="cb-col"><i>BOOKING</i><div class="cb-cr"></div><div class="cb-cr b"></div></div><div class="cb-col"><i>SOLD</i><div class="cb-cr b"></div><div class="cb-cr b"></div><div class="cb-cr"></div></div></div></div></div><div class="cb-base"><div class="cb-keys"></div><div class="cb-pad"></div></div></div><div class="cb-clock"></div><div class="cb-fl cb-qc"><div class="t"><span class="cb-doc" style="width:10px;height:12px"></span>QC Teknisi</div><div class="r">Baterai<b>92%</b></div><div class="r">Status<b>Lolos</b></div></div><p class="cb-tag">Laptop second berkualitas, tercatat rapi.</p></section>
    <section class="cb-side">
      <div class="cb-brand"><span class="lg"></span><span>NISCAYA <span>MAKASSAR</span></span></div>
      <h1 class="cb-h1">Masuk</h1>
      <div class="cb-card">
        <div class="cb-seg"><a href="/">Owner</a><button type="button" class="on">Teknisi</button></div>
        <div class="cb-ttl">Halo, teknisi</div>
        <div class="cb-sub">Akun teknisi dibuat oleh owner.</div>
        <form id="lf"><label for="lu">Nama akun</label><input id="lu" autocomplete="username" autocapitalize="none" required>
        <label for="lp">Kata sandi</label><input id="lp" type="password" autocomplete="current-password" required>
        <div class="err" id="le">${esc(msg||'')}</div>
        <button class="cb-go" type="submit">Lanjutkan</button></form>
      </div>
      <p class="cb-foot">Lupa kata sandi? Hubungi owner.</p>
    </section></div></div>`;
  $('#lf').onsubmit = async e => { e.preventDefault(); $('#le').textContent=''; const b = e.target.querySelector('.cb-go'); b.disabled = true;
    try{ const j = await api('/tapi/login',{username:$('#lu').value.trim(),password:$('#lp').value}); ME=j.akun; await loadJobs(); }
    catch(err){ if(err.message!=='401') $('#le').textContent=err.message; b.disabled = false; } };
}
async function loadJobs(){ const j = await api('/tapi/jobs'); JOBS = j.jobs; VER = j.version; render(); }

function render(){
  const bln = new Date(); const awal = new Date(bln.getFullYear(), bln.getMonth(), 1).getTime()/1000;
  const aktif = JOBS.filter(j=>j.status==='Antri'||j.status==='Dikerjakan');
  const selesaiBln = JOBS.filter(j=>j.status==='Selesai' && (j.selesai||0)>=awal);
  const upahBln = selesaiBln.reduce((a,j)=>a+(Number(j.upah)||0),0);
  const list = (TAB==='aktif' ? aktif : JOBS.filter(j=>j.status!=='Antri'&&j.status!=='Dikerjakan')).slice().sort((a,b)=>(b.diubah||b.dibuat||0)-(a.diubah||a.dibuat||0));
  $('#app').innerHTML = `
    <div class="top"><div class="brand">NISCAYA <i>MAKASSAR</i><div class="dim" style="font-weight:600">${esc(ME.roleLabel||'Teknisi')}</div></div>
      <div class="who"><b>${esc(ME.label)}</b><br><button class="btn sm" id="out" style="margin-top:4px">Keluar</button></div></div>
    <div class="stats"><div class="stat"><b>${aktif.length}</b><span>pekerjaan aktif</span></div>
      <div class="stat"><b>${selesaiBln.length}</b><span>selesai bulan ini</span></div>
      <div class="stat"><b style="font-size:15px">${rp(upahBln)}</b><span>upah bulan ini</span></div></div>
    <div class="tabs"><button class="tab ${TAB==='aktif'?'on':''}" data-tab="aktif">Aktif (${aktif.length})</button><button class="tab ${TAB==='riwayat'?'on':''}" data-tab="riwayat">Riwayat (${JOBS.length-aktif.length})</button></div>
    ${list.map(jobHtml).join('') || `<div class="card empty">${TAB==='aktif'?'Belum ada pekerjaan. Tugas baru dari owner akan muncul di sini otomatis.':'Belum ada riwayat.'}</div>`}`;
  $('#out').onclick = async () => { try{ await api('/tapi/logout',{}); }catch(_){} ME=null; renderLogin(); };
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab; render();});
  JOBS.forEach(wireJob);
}
function jobHtml(j){
  const u = j.unit||{}; const h = jam(j); const telat = h!==null && j.targetJam && h > j.targetJam;
  const kunci = !!j.biayaMasuk, bisa = !kunci;
  return `<div class="card job" id="j-${esc(j.id)}">
    <div class="row"><h3>${esc(u.merek||'')} ${esc(u.tipe||'')} <span class="dim" style="font-weight:600">· ${esc(j.unitId||u.id||'')}</span></h3><span class="badge b-${esc(j.status)}">${esc(j.status)}</span></div>
    <div class="spec">${esc([u.processor,u.ram,u.ssd,u.vga,u.layar].filter(Boolean).join(' · ')||'-')}${u.noSeri?' · SN '+esc(u.noSeri):''}</div>
    <div class="row" style="font-size:13px"><span><b>${esc(j.jenis||'-')}</b> · ${esc(j.id)}</span><span>Target ${j.targetJam?fmtJam(Number(j.targetJam)):'-'} · Durasi <span class="${telat?'late':''}">${fmtJam(h)}</span></span></div>
    ${j.catatanOwner?`<div class="note"><b>Catatan owner:</b> ${esc(j.catatanOwner)}</div>`:''}
    <div class="dim" style="font-size:12px">Ditugaskan ${tgl(j.dibuat)} · Mulai ${tgl(j.mulai)} · Selesai ${tgl(j.selesai)} · Upah ${rp(j.upah)}${kunci?' · 🔒 sudah diverifikasi owner':''}</div>
    <details ${OPEN.has(j.id)?'open':''} data-det="${esc(j.id)}"><summary>Laporan kerja, part &amp; foto</summary>
      <label>Kerusakan yang ditemukan</label><textarea data-f="catatanKerusakan" ${bisa?'':'disabled'}>${esc(j.catatanKerusakan||'')}</textarea>
      <label>Hasil pekerjaan</label><textarea data-f="hasil" ${bisa?'':'disabled'}>${esc(j.hasil||'')}</textarea>
      <label>Sparepart dipakai (total ${rp(totalParts(j))})</label>
      <div class="parts" data-parts>${(j.parts||[]).map(p=>partRow(p,bisa)).join('')}</div>
      ${bisa?'<button class="btn sm" data-addpart type="button">+ Part</button>':''}
      <label>Link foto sebelum (satu per baris)</label><textarea data-f="fotoSebelum" placeholder="https://..." ${bisa?'':'disabled'}>${esc((j.fotoSebelum||[]).join('\n'))}</textarea>
      <label>Link foto sesudah (satu per baris)</label><textarea data-f="fotoSesudah" placeholder="https://..." ${bisa?'':'disabled'}>${esc((j.fotoSesudah||[]).join('\n'))}</textarea>
      ${(j.fotoSebelum||[]).concat(j.fotoSesudah||[]).map((f,i)=>`<a href="${esc(f)}" target="_blank" rel="noopener" style="font-size:12.5px;margin-right:10px">Foto ${i+1}</a>`).join('')}
      ${j.status==='Gagal'?`<label>Alasan gagal</label><textarea data-f="alasanGagal" ${bisa?'':'disabled'}>${esc(j.alasanGagal||'')}</textarea>`:''}
      ${bisa?'<div class="acts"><button class="btn dark sm" data-save>Simpan laporan</button></div>':''}
    </details>
    ${bisa?`<div class="acts">
      ${j.status==='Antri'?'<button class="btn dark" data-st="Dikerjakan">▶ Mulai kerjakan</button>':''}
      ${j.status==='Dikerjakan'?'<button class="btn green" data-st="Selesai">✓ Selesai</button><button class="btn red" data-st="Gagal">✕ Gagal / tidak bisa</button>':''}
      ${(j.status==='Selesai'||j.status==='Gagal')?'<button class="btn sm" data-st="Dikerjakan">↺ Kerjakan lagi</button>':''}
    </div>`:''}
  </div>`;
}
function partRow(p,bisa){ return `<div class="pr"><input data-pn placeholder="Nama part" value="${esc(p.nama||'')}" ${bisa?'':'disabled'}><input data-pv inputmode="numeric" placeholder="Rp" value="${p.nominal?Number(p.nominal).toLocaleString('id-ID'):''}" ${bisa?'':'disabled'}>${bisa?'<button class="btn sm red" data-delpart type="button">✕</button>':'<span></span>'}</div>`; }
function collect(el){
  const v = f => { const x = el.querySelector(`[data-f="${f}"]`); return x ? x.value : undefined; };
  const lines = t => (t||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const o = { catatanKerusakan:v('catatanKerusakan'), hasil:v('hasil'), fotoSebelum:lines(v('fotoSebelum')), fotoSesudah:lines(v('fotoSesudah')),
    parts:[...el.querySelectorAll('.pr')].map(r=>({nama:r.querySelector('[data-pn]').value, nominal:Number(r.querySelector('[data-pv]').value.replace(/\D/g,''))||0})) };
  if(v('alasanGagal')!==undefined) o.alasanGagal = v('alasanGagal');
  const bad = o.fotoSebelum.concat(o.fotoSesudah).filter(x=>!/^https?:\/\//i.test(x));
  if(bad.length){ toast('Link foto harus diawali http:// atau https://'); return null; }
  return o;
}
function wireJob(j){
  const el = document.getElementById('j-'+j.id); if(!el) return;
  const det = el.querySelector('[data-det]'); if(det) det.ontoggle = () => { det.open ? OPEN.add(j.id) : OPEN.delete(j.id); };
  const add = el.querySelector('[data-addpart]'); if(add) add.onclick = () => { el.querySelector('[data-parts]').insertAdjacentHTML('beforeend', partRow({},true)); wireParts(el); };
  wireParts(el);
  const sv = el.querySelector('[data-save]'); if(sv) sv.onclick = async () => { const o = collect(el); if(!o) return; sv.disabled = true;
    try{ await api('/tapi/jobs/'+j.id, o); toast('Laporan disimpan'); await loadJobs(); }catch(e){ if(e.message!=='401') toast(e.message); } sv.disabled = false; };
  el.querySelectorAll('[data-st]').forEach(b => b.onclick = async () => {
    const st = b.dataset.st;
    if(st==='Gagal' && !confirm('Tandai pekerjaan ini GAGAL / tidak bisa diperbaiki?')) return;
    if(st==='Selesai' && !confirm('Tandai pekerjaan ini SELESAI?')) return;
    const o = det && det.open ? collect(el) : {}; if(o===null) return;
    b.disabled = true;
    try{ await api('/tapi/jobs/'+j.id, Object.assign(o, {status:st})); toast('Status: '+st); if(st==='Gagal'){ OPEN.add(j.id); } await loadJobs(); }
    catch(e){ if(e.message!=='401') toast(e.message); b.disabled = false; }
  });
}
function wireParts(el){
  el.querySelectorAll('[data-delpart]').forEach(b=>b.onclick=()=>b.closest('.pr').remove());
  el.querySelectorAll('[data-pv]').forEach(i=>i.oninput=()=>{ const d=i.value.replace(/\D/g,''); i.value = d ? Number(d).toLocaleString('id-ID') : ''; });
}
function typing(){ const a=document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName); }
setInterval(async () => {
  if(!ME || document.hidden || typing()) return;
  try{ const j = await api('/tapi/jobs'); if(j.version !== VER){ const baru = j.jobs.filter(x=>!JOBS.some(y=>y.id===x.id)).length; JOBS=j.jobs; VER=j.version; render(); if(baru) toast(baru+' pekerjaan baru dari owner'); } }catch(_){}
}, 8000);
(async () => { try{ const m = await api('/tapi/me'); if(m.loggedIn){ ME=m.akun; await loadJobs(); } else renderLogin(); }catch(e){ if(e.message!=='401') renderLogin('Server teknisi belum siap. Coba lagi sebentar.'); } })();
</script>
</body>
