<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NISCAYA MAKASSAR — Teknisi</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:#eef1f6;color:#14161f}
button,input,textarea,select{font:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 90px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.brand{font-weight:800;font-size:17px}.brand i{font-style:normal;color:#1a5fd6}
.who{font-size:12.5px;color:#5b6475;text-align:right}
.btn{border:1.5px solid #14161f;background:#fff;color:#14161f;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn.dark{background:#14161f;color:#fff}.btn.green{background:#1f845a;border-color:#1f845a;color:#fff}.btn.red{background:#fff;border-color:#c9372c;color:#c9372c}
.btn.sm{padding:6px 12px;font-size:12.5px}.btn:disabled{opacity:.5}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 24px -16px rgba(20,45,95,.35);margin-bottom:12px}
.login{max-width:380px;margin:12vh auto 0}
.login h1{font-size:22px;margin:0 0 4px}.dim{color:#5b6475;font-size:13px}
label{display:block;font-size:12.5px;font-weight:700;margin:12px 0 5px;color:#3b4252}
input,textarea,select{width:100%;padding:11px 12px;border:1.5px solid #d6dbe6;border-radius:12px;background:#fff}
textarea{min-height:70px;resize:vertical}
.err{color:#c9372c;font-size:13px;margin-top:10px;min-height:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:14px;padding:11px 12px}.stat b{display:block;font-size:19px}.stat span{font-size:11.5px;color:#5b6475}
button.stat{border:2px solid transparent;text-align:left;cursor:pointer;color:inherit;font:inherit;transition:border-color .15s,transform .15s,box-shadow .15s}
button.stat:hover{border-color:#c9d3e6;transform:translateY(-1px);box-shadow:0 8px 18px -14px rgba(20,45,95,.5)}
button.stat.on{border-color:#14161f}
button.stat:focus-visible,.tab:focus-visible,.mnav button:focus-visible{outline:3px solid #1a5fd6;outline-offset:2px}
.stat em{display:block;font-style:normal;font-size:10.5px;color:#1a5fd6;font-weight:700;margin-top:3px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border-radius:999px;padding:5px;margin-bottom:12px}
.mnav b{font-size:14px}.mnav button{border:0;background:#eef1f6;border-radius:999px;width:36px;height:36px;font-size:18px;font-weight:800;cursor:pointer}
.mnav button:disabled{opacity:.35;cursor:default}
.upah{width:100%;border-collapse:collapse;font-size:13px}
.upah th{text-align:left;font-size:11.5px;color:#5b6475;font-weight:700;padding:6px 6px;border-bottom:1.5px solid #e3e8f1}
.upah td{padding:9px 6px;border-bottom:1px solid #eef1f6;vertical-align:top}
.upah td.n,.upah th.n{text-align:right;white-space:nowrap}
.upah tbody tr{cursor:pointer}.upah tbody tr:hover{background:#f4f6fb}
.upah tfoot td{font-weight:800;border:0;padding-top:11px}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}
.tab{border:0;background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer}
.tab.on{background:#14161f;color:#fff}
.job h3{margin:0 0 4px;font-size:15.5px}
.badge{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:4px 9px;color:#fff}
.b-Antri{background:#8590a2}.b-Dikerjakan{background:#cf9f02}.b-Selesai{background:#1f845a}.b-Gagal{background:#c9372c}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.spec{font-size:12.5px;color:#3b4252;margin:6px 0}
.note{background:#f4f6fb;border-radius:12px;padding:9px 11px;font-size:13px;margin:8px 0}
.late{color:#c9372c;font-weight:700}
.parts .pr{display:grid;grid-template-columns:1fr 120px 36px;gap:6px;margin-bottom:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.empty{text-align:center;color:#5b6475;padding:30px 10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#14161f;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.toast.on{opacity:1}
details summary{cursor:pointer;font-weight:700;font-size:13px;margin-top:8px}
/*CB-LOGIN*/
#loginOverlay,#tLogin{background:#c9c9d6;font-family:Inter,'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif;color:#1b1d36}
.cb-page{width:calc(100% - 48px);max-width:1080px;min-height:min(640px,calc(100% - 48px));margin:24px auto;display:grid;grid-template-columns:1.12fr 1fr;background:#fff;box-shadow:0 30px 80px -20px rgba(30,30,70,.35);border-radius:4px;overflow:hidden}
#loginOverlay{display:flex;align-items:center}
.cb-art{background:#f6f7fd;position:relative;overflow:hidden;min-height:560px}
.l3-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:1600px;padding:80px 0 0 70px}
.l3{position:relative;width:360px;height:240px;transform-style:preserve-3d;transform:rotateX(58deg) rotateZ(-32deg) translateZ(-30px);animation:l3f 7s ease-in-out infinite}
@keyframes l3f{0%,100%{transform:rotateX(58deg) rotateZ(-32deg) translateZ(-30px)}50%{transform:rotateX(58deg) rotateZ(-29deg) translateZ(-18px)}}
.l3-sh{position:absolute;inset:-8% -6%;border-radius:28px;background:radial-gradient(closest-side,rgba(30,32,70,.6),rgba(30,32,70,0));transform:translateZ(-14px);filter:blur(10px)}
.l3-base{position:absolute;inset:0;border-radius:14px;transform-style:preserve-3d}
.l3-top{position:absolute;inset:0;border-radius:14px;background:linear-gradient(135deg,#e9ebf0 0%,#cfd2da 45%,#b9bdc7 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),inset 0 -2px 6px rgba(0,0,0,.08)}
.l3-side{position:absolute;left:0;right:0;bottom:0;height:12px;transform-origin:bottom;transform:rotateX(-90deg);border-radius:0 0 12px 12px;background:linear-gradient(#a9adb7,#7d818c)}
.l3-sideR{position:absolute;top:0;bottom:0;right:0;width:12px;transform-origin:right;transform:rotateY(90deg);background:linear-gradient(90deg,#8d919c,#6f737e);border-radius:0 12px 12px 0}
.l3-kb{position:absolute;left:24px;right:24px;top:22px;height:118px;border-radius:6px;background:#2a2c33;padding:6px;display:flex;flex-direction:column;gap:4px;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.kr{display:flex;gap:4px;flex:1}
.kr i{flex:1;border-radius:3px;background:linear-gradient(#3b3e47,#2f3139);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 0 #15161a}
.kr i.w{flex:6}
.l3-tp{position:absolute;left:50%;bottom:16px;width:128px;height:72px;margin-left:-64px;border-radius:8px;background:linear-gradient(135deg,#d6d9e0,#c2c6cf);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.6)}
.l3-lid{position:absolute;left:0;right:0;bottom:100%;height:236px;transform-origin:bottom;transform:rotateX(-102deg);transform-style:preserve-3d}
.l3-back{position:absolute;inset:0;border-radius:14px 14px 4px 4px;background:linear-gradient(160deg,#d9dce3,#a7abb5);transform:translateZ(-8px)}
.l3-edge{position:absolute;left:0;right:0;top:0;height:8px;transform-origin:top;transform:rotateX(90deg);background:#9a9ea9;border-radius:6px 6px 0 0}
.l3-face{position:absolute;inset:0;border-radius:14px 14px 4px 4px;background:#16171c;padding:12px 12px 16px;box-shadow:inset 0 0 0 1px #3a3c44}
.l3-face:before{content:"";position:absolute;top:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#30323a}
.l3-scr{position:relative;width:100%;height:100%;border-radius:3px;overflow:hidden;background:#f4f6fb;display:flex;flex-direction:column}
.l3-scr:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 100%);pointer-events:none}
.l3-nav{height:20px;background:#fff;display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid #eceef5}
.l3-nav b{font-size:7.5px;letter-spacing:.3px;color:#1b1d36;white-space:nowrap}.l3-nav b span{color:#1a33ff}
.l3-nav .s{flex:1;height:7px;border-radius:4px;background:#eef0f6}.l3-nav .a{width:22px;height:8px;border-radius:2px;background:#1a33ff}
.l3-body{flex:1;display:flex;gap:6px;padding:7px}
.l3-menu{width:44px;display:flex;flex-direction:column;gap:5px}
.l3-menu i{height:6px;border-radius:3px;background:#dfe2ec}.l3-menu i.on{background:#1a33ff}
.l3-main{flex:1;display:flex;flex-direction:column;gap:6px}
.l3-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.l3-kpi div{height:26px;border-radius:3px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06);position:relative}
.l3-kpi div:before{content:"";position:absolute;left:5px;top:6px;width:45%;height:5px;border-radius:2px;background:#1b1d36;opacity:.8}
.l3-kpi div:after{content:"";position:absolute;left:5px;bottom:6px;width:65%;height:3px;border-radius:2px;background:#cfd3e2}
.l3-cols{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.l3-col{background:#e9ecf5;border-radius:3px;padding:4px;display:flex;flex-direction:column;gap:4px}
.l3-col u{height:4px;width:40%;border-radius:2px;background:#9aa0b8}
.l3-col i{height:17px;border-radius:2px;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.06);position:relative}
.l3-col i:after{content:"";position:absolute;left:4px;top:5px;width:62%;height:3px;border-radius:2px;background:#d4d8e7}
.l3-col i.b:before{content:"";position:absolute;left:4px;bottom:4px;width:32%;height:3px;border-radius:2px;background:#1a33ff}

.cb-side{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 36px;gap:20px}
.cb-brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:.2px;color:#1b1d36}
.cb-brand img{width:26px;height:26px;border-radius:6px;object-fit:cover}
.cb-brand .lg{width:24px;height:24px;border-radius:5px;background:#1a33ff;display:flex;align-items:center;justify-content:center}
.cb-brand .lg:after{content:"";width:12px;height:8px;border:2px solid #fff;border-bottom-width:3px;border-radius:2px}
.cb-brand span span{color:#1a33ff}
.cb-h1{font-size:23px;font-weight:600;margin:0;color:#1b1d36}
.cb-card{width:100%;max-width:340px;background:#fff;border:1px solid #f0f1f7;box-shadow:0 10px 40px -18px rgba(40,40,90,.25);padding:24px 22px}
.cb-seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid #1a33ff;border-radius:3px;overflow:hidden;margin-bottom:16px}
.cb-seg>*{border:0;background:#fff;color:#1a33ff;font-family:inherit;font-weight:600;font-size:13px;line-height:1;padding:10px;cursor:pointer;text-align:center;text-decoration:none}
.cb-seg>.on{background:#1a33ff;color:#fff}
.cb-foot{font-size:12.5px;color:#7a7f9a;margin:0;text-align:center}
.cb-foot button{background:none;border:0;padding:0;color:#1a33ff;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer}
.cb-foot button:hover{text-decoration:underline}
@media(max-width:820px){
  .cb-page{width:100%;min-height:100%;margin:0;grid-template-columns:1fr;border-radius:0;box-shadow:none}
  #loginOverlay{display:block;background:#fff}
  .cb-art{min-height:0;height:260px}
  .l3-wrap{transform:scale(.56);padding:110px 0 0 60px}
  .cb-side{padding:26px 18px 40px}
}
#tLogin{position:fixed;inset:0;z-index:50;overflow:auto;display:flex;align-items:center}
#tLogin .cb-card label{font-size:11.5px;font-weight:500;color:#7a7f9a;margin:12px 0 5px}
#tLogin .cb-card input{height:44px;border:1px solid #e3e5f0;border-radius:3px;font-size:14px}
#tLogin .cb-card input:focus{outline:none;border-color:#1a33ff;box-shadow:0 0 0 3px rgba(26,51,255,.12)}
#tLogin .cb-ttl{font-size:17px;font-weight:600;text-align:center;margin:0 0 4px}
#tLogin .cb-sub{font-size:12px;color:#7a7f9a;text-align:center;margin:0 0 4px;line-height:1.5}
#tLogin .cb-go{width:100%;height:44px;margin-top:6px;border:0;border-radius:3px;background:#1a33ff;color:#fff;font-weight:600;font-size:14px;cursor:pointer}
#tLogin .cb-go:hover{background:#1226d6}#tLogin .cb-go:disabled{opacity:.6}
@media(max-width:820px){#tLogin{display:block;background:#fff}}
/*NM-LOGIN v4*/
:is(#loginOverlay,#tLogin){background:radial-gradient(1200px 700px at 85% 10%,#ee5f64 0%,rgba(238,95,100,0) 60%),linear-gradient(135deg,#600206 0%,#8e090d 45%,#b5141a 100%);color:#540b0d;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-family:Poppins,'Plus Jakarta Sans',Inter,'Segoe UI',system-ui,-apple-system,sans-serif}
:is(#loginOverlay,#tLogin):before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1.6px 1.6px at 6% 12%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 18% 74%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 31% 28%,rgba(255,255,255,.9) 50%,transparent 51%),radial-gradient(1.3px 1.3px at 47% 91%,#fff 50%,transparent 51%),radial-gradient(1.8px 1.8px at 63% 8%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 77% 63%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 92% 37%,#fff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 97% 86%,#fff 50%,transparent 51%);opacity:.75;animation:nmTw 5s ease-in-out infinite}
@keyframes nmTw{0%,100%{opacity:.75}50%{opacity:.35}}
:is(#loginOverlay,#tLogin) .cb-page{position:relative;width:min(1640px,calc(100% - 64px));max-width:none;min-height:min(920px,calc(100vh - 64px));margin:32px auto;grid-template-columns:1.25fr 1fr;border-radius:18px;background:linear-gradient(140deg,#a20c11 0%,#cb1d23 52%,#e44146 100%);box-shadow:0 50px 120px -30px rgba(30,0,1,.75),inset 0 0 0 1px rgba(255,255,255,.08)}
:is(#loginOverlay,#tLogin) .cb-art{background:none;min-height:620px;overflow:visible;z-index:1}
.cb-art:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 9% 18%,#fff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 22% 62%,#fff 50%,transparent 51%),radial-gradient(2.4px 2.4px at 38% 12%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 56% 84%,#fff 50%,transparent 51%),radial-gradient(1.8px 1.8px at 71% 22%,#fff 50%,transparent 51%),radial-gradient(1.3px 1.3px at 12% 88%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 84% 70%,#fff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 48% 40%,rgba(255,255,255,.8) 50%,transparent 51%);animation:nmTw 4s ease-in-out infinite reverse}
.nm-orb{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.28),rgba(255,255,255,.05) 70%);animation:nmOrb 9s ease-in-out infinite}
.nm-orb.o1{width:150px;height:150px;left:-40px;top:-30px;background:radial-gradient(circle at 40% 40%,rgba(245,59,65,.75),rgba(188,22,28,.15) 72%)}
.nm-orb.o2{width:90px;height:90px;left:12%;bottom:12%;animation-delay:-3s}
.nm-orb.o3{width:46px;height:46px;left:52%;top:16%;animation-delay:-6s}
@keyframes nmOrb{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.nm-hero{position:absolute;left:8%;top:7.5%;color:#fff;z-index:3;display:flex;align-items:center;gap:clamp(14px,1.4vw,26px)}
.nm-logo{flex:none;width:clamp(72px,6.4vw,128px);height:clamp(72px,6.4vw,128px);border-radius:22%;object-fit:cover;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 0 7px rgba(255,255,255,.16),0 18px 40px -12px rgba(55,0,2,.65);animation:nmOrb 9s ease-in-out infinite}
.nm-hero h2{margin:0;font-weight:600;font-size:clamp(28px,2.6vw,52px);letter-spacing:.3px;line-height:1.1;text-shadow:0 6px 24px rgba(60,0,2,.35)}
.nm-hero p{margin:8px 0 0 2px;font-size:clamp(13px,1vw,19px);opacity:.88;letter-spacing:.4px}
.nm-trail{position:absolute;inset:0;pointer-events:none;z-index:1}
.nm-trail i{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.4),0 10px 30px -10px rgba(110,0,4,.5);animation:nmBub 4.5s ease-in-out infinite}
.nm-trail i:nth-child(1){width:14px;height:14px;left:47%;top:70%;opacity:.55;animation-delay:-.2s}
.nm-trail i:nth-child(2){width:20px;height:20px;left:53%;top:73%;opacity:.65;animation-delay:-.6s}
.nm-trail i:nth-child(3){width:28px;height:28px;left:59%;top:70%;opacity:.75;animation-delay:-1s}
.nm-trail i:nth-child(4){width:38px;height:38px;left:66%;top:74%;opacity:.85;animation-delay:-1.4s}
.nm-trail i:nth-child(5){width:52px;height:52px;left:73%;top:69%;opacity:.92;animation-delay:-1.8s}
.nm-trail i:nth-child(6){width:70px;height:70px;left:80%;top:73%;animation-delay:-2.2s}
.nm-trail i:nth-child(7){width:92px;height:92px;left:87%;top:64%;animation-delay:-2.6s}
.nm-trail i:nth-child(8){width:120px;height:120px;left:92%;top:76%;animation-delay:-3s}
.nm-trail i:nth-child(9){width:24px;height:24px;left:63%;top:62%;opacity:.5;animation-delay:-3.4s}
.nm-trail i:nth-child(10){width:44px;height:44px;left:84%;top:56%;opacity:.8;animation-delay:-3.8s}
@keyframes nmBub{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4px,-8px) scale(1.06)}}
:is(#loginOverlay,#tLogin) .l3-wrap{z-index:2;padding:250px 40px 0 0;perspective:1800px;transform:scale(1.05);transform-origin:45% 55%}
:is(#loginOverlay,#tLogin) .l3{animation:nmWob 6.5s ease-in-out infinite;will-change:transform}
@keyframes nmWob{
0%,100%{transform:rotateX(57deg) rotateY(0deg) rotateZ(-32deg) translateZ(-26px)}
20%{transform:rotateX(63deg) rotateY(7deg) rotateZ(-25deg) translateZ(-6px)}
40%{transform:rotateX(55deg) rotateY(-3deg) rotateZ(-38deg) translateZ(-20px)}
60%{transform:rotateX(61deg) rotateY(-8deg) rotateZ(-29deg) translateZ(4px)}
80%{transform:rotateX(52deg) rotateY(4deg) rotateZ(-35deg) translateZ(-14px)}}
:is(#loginOverlay,#tLogin) .l3-lid{animation:nmLid 6.5s ease-in-out infinite}
@keyframes nmLid{0%,100%{transform:rotateX(-102deg)}35%{transform:rotateX(-96deg)}70%{transform:rotateX(-108deg)}}
:is(#loginOverlay,#tLogin) .l3-sh{background:radial-gradient(closest-side,rgba(45,0,1,.7),rgba(45,0,1,0));animation:nmSh 6.5s ease-in-out infinite}
@keyframes nmSh{0%,100%{opacity:.9}20%,60%{opacity:.55}}
:is(#loginOverlay,#tLogin) .l3-scr:after{animation:nmGlare 6.5s ease-in-out infinite}
@keyframes nmGlare{0%,100%{opacity:1;transform:translateX(0)}50%{opacity:.55;transform:translateX(18%)}}
:is(#loginOverlay,#tLogin) .l3-nav b span,:is(#loginOverlay,#tLogin) .l3-menu i.on{color:#ca2329}
:is(#loginOverlay,#tLogin) .l3-nav .a,:is(#loginOverlay,#tLogin) .l3-menu i.on,:is(#loginOverlay,#tLogin) .l3-col i.b:before{background:#ca2329}
:is(#loginOverlay,#tLogin) .cb-side{position:relative;background:#fff;padding:60px clamp(36px,4vw,90px);gap:18px;z-index:2}
:is(#loginOverlay,#tLogin) .cb-side:before{content:"";position:absolute;left:-60px;top:0;bottom:0;width:122px;pointer-events:none;background:radial-gradient(circle at 64px 62px,#fff 50px,transparent 51px) 0 0/122px 150px repeat-y,radial-gradient(circle at 90px 24px,#fff 38px,transparent 39px) 0 40px/122px 110px repeat-y,radial-gradient(circle at 44px 34px,#fff 30px,transparent 31px) 0 70px/122px 190px repeat-y,linear-gradient(#fff,#fff) 92px 0/30px 100% no-repeat}
:is(#loginOverlay,#tLogin) .cb-side>*{position:relative;z-index:1}
:is(#loginOverlay,#tLogin) .cb-brand{font-size:15px;color:#540b0d}
:is(#loginOverlay,#tLogin) .cb-brand .lg{background:#ca2329}
:is(#loginOverlay,#tLogin) .cb-brand span span{color:#ca2329}

async function api(path, body){
  const o = body===undefined ? {cache:'no-store',credentials:'same-origin'} : {method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)};

      ${rows.map(j=>{ const u=j.unit||{}; return `<tr data-open="${esc(j.id)}" tabindex="0" title="Lihat detail pekerjaan"><td>${tgl(j.selesai)}</td><td><b>${esc(u.merek||'')} ${esc(u.tipe||'')}</b><br><span class="dim">${esc(j.jenis||'-')} · ${esc(j.id)}</span></td><td class="n">${fmtJam(jam(j))}</td><td class="n">${rp(j.upah)}</td></tr>`; }).join('')}
      </tbody><tfoot><tr><td colspan="3">Total ${rows.length} pekerjaan</td><td class="n">${rp(tot)}</td></tr></tfoot></table>
      <div class="dim" style="font-size:12px;margin-top:8px">Dihitung dari pekerjaan berstatus Selesai pada ${esc(B.label)}. Ketuk baris untuk melihat detail.</div></div>`
      : `<div class="d-empty">${Q?'Tidak ada yang cocok dengan pencarian.':'Belum ada upah pada '+esc(B.label)+'.'}</div>`;
  } else {
    const list = (TAB==='aktif' ? aktif.slice().sort(urut) : TAB==='bulan' ? selesaiBln.slice().sort((a,b)=>(b.selesai||0)-(a.selesai||0)) : JOBS.filter(j=>!isAktif(j)).sort(urut)).filter(cocok);
    const kosong = Q ? 'Tidak ada yang cocok dengan pencarian.' : TAB==='aktif' ? 'Belum ada pekerjaan. Tugas baru dari owner akan muncul di sini otomatis.' : TAB==='bulan' ? 'Belum ada pekerjaan selesai pada '+esc(B.label)+'.' : 'Belum ada riwayat.';
    html = list.length ? `<div class="tiles">${list.map(tileHtml).join('')}</div>` : `<div class="d-empty">${kosong}</div>`;
  }
  const l=$('#list'); if(!l) return; l.innerHTML = html; wireOpen(l);
}
function tileHtml(j){
  const u=j.unit||{}, g=progres(j), h=jam(j);
  const pill = j.status==='Selesai' ? `<span class="pill ok">${lalu(j.selesai)}</span>` : j.status==='Dikerjakan' ? `<span class="pill ${g.late?'':'run'}">${g.late?'Lewat target':'Dikerjakan'}</span>` : j.status==='Gagal' ? `<span class="pill">Gagal</span>` : `<span class="pill run">Antri · ${lalu(j.dibuat)}</span>`;
  return `<button type="button" class="tile st-${esc(j.status)}" data-open="${esc(j.id)}"><span class="ti-ic">${iconJob(j)}</span><span class="ti-more">⋮</span>
    <h4>${esc(u.merek||'')} ${esc(u.tipe||'')}</h4><p>${esc(j.jenis||'-')} · ${esc(j.unitId||u.id||j.id)}</p>
    <span class="pg"><span>Progres</span><span>${g.p}%</span></span><span class="bar"><i class="${g.late?'late':''}" style="width:${g.p}%"></i></span>
    <span class="ft"><span>${fmtJam(h)} / ${j.targetJam?fmtJam(Number(j.targetJam)):'-'} · ${rp(j.upah)}</span>${pill}</span></button>`;
}
function modalHtml(){ const j = JOBS.find(x=>x.id===MODAL); if(!j){ MODAL=null; return ''; } OPEN.add(j.id);
  return `<div class="mdl" id="mdl" role="dialog" aria-modal="true"><div class="mdl-box"><button type="button" class="mdl-x" id="mdlX" aria-label="Tutup">✕</button>${jobHtml(j)}</div></div>`; }
function wireOpen(root){ root.querySelectorAll('[data-open]').forEach(r=>{ const go=()=>{ MODAL=r.dataset.open; openModal(); }; r.onclick=go; if(r.tagName==='TR') r.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } }; }); }
function openModal(){ const old=$('#mdl'); if(old) old.remove(); document.body.insertAdjacentHTML('beforeend', modalHtml()); wireModal(); }
function closeModal(){ MODAL=null; const m=$('#mdl'); if(m) m.remove(); }
function wireModal(){ const m=$('#mdl'); if(!m) return; const j=JOBS.find(x=>x.id===MODAL); if(j) wireJob(j);
  $('#mdlX').onclick=closeModal; m.onclick=e=>{ if(e.target===m) closeModal(); }; }
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && MODAL) closeModal(); });
function jobHtml(j){
  const u = j.unit||{}; const h = jam(j); const telat = h!==null && j.targetJam && h > j.targetJam;
  const kunci = !!j.biayaMasuk, bisa = !kunci;
  return `<div class="card job" id="j-${esc(j.id)}">
    <div class="row"><h3>${esc(u.merek||'')} ${esc(u.tipe||'')} <span class="dim" style="font-weight:600">· ${esc(j.unitId||u.id||'')}</span></h3><span class="badge b-${esc(j.status)}">${esc(j.status)}</span></div>
    <div class="spec">${esc([u.processor,u.ram,u.ssd,u.vga,u.layar].filter(Boolean).join(' · ')||'-')}${u.noSeri?' · SN '+esc(u.noSeri):''}</div>
    <div class="row" style="font-size:13px"><span><b>${esc(j.jenis||'-')}</b> · ${esc(j.id)}</span><span>Target ${j.targetJam?fmtJam(Number(j.targetJam)):'-'} · Durasi <span class="${telat?'late':''}">${fmtJam(h)}</span></span></div>
    ${j.catatanOwner?`<div class="note"><b>Catatan owner:</b> ${esc(j.catatanOwner)}</div>`:''}
    <div class="dim" style="font-size:12px">Ditugaskan ${tgl(j.dibuat)} · Mulai ${tgl(j.mulai)} · Selesai ${tgl(j.selesai)} · Upah ${rp(j.upah)}${kunci?' · 🔒 sudah diverifikasi owner':''}</div>
    <details ${OPEN.has(j.id)?'open':''} data-det="${esc(j.id)}"><summary>Laporan kerja, part &amp; foto</summary>
      <label>Kerusakan yang ditemukan</label><textarea data-f="catatanKerusakan" ${bisa?'':'disabled'}>${esc(j.catatanKerusakan||'')}</textarea>
      <label>Hasil pekerjaan</label><textarea data-f="hasil" ${bisa?'':'disabled'}>${esc(j.hasil||'')}</textarea>
      <label>Sparepart dipakai (total ${rp(totalParts(j))})</label>
      <div class="parts" data-parts>${(j.parts||[]).map(p=>partRow(p,bisa)).join('')}</div>
      ${bisa?'<button class="btn sm" data-addpart type="button">+ Part</button>':''}
      <label>Link foto sebelum (satu per baris)</label><textarea data-f="fotoSebelum" placeholder="https://..." ${bisa?'':'disabled'}>${esc((j.fotoSebelum||[]).join('\n'))}</textarea>
      <label>Link foto sesudah (satu per baris)</label><textarea data-f="fotoSesudah" placeholder="https://..." ${bisa?'':'disabled'}>${esc((j.fotoSesudah||[]).join('\n'))}</textarea>
      ${(j.fotoSebelum||[]).concat(j.fotoSesudah||[]).map((f,i)=>`<a href="${esc(f)}" target="_blank" rel="noopener" style="font-size:12.5px;margin-right:10px">Foto ${i+1}</a>`).join('')}
      ${j.status==='Gagal'?`<label>Alasan gagal</label><textarea data-f="alasanGagal" ${bisa?'':'disabled'}>${esc(j.alasanGagal||'')}</textarea>`:''}
      ${bisa?'<div class="acts"><button class="btn dark sm" data-save>Simpan laporan</button></div>':''}
    </details>
    ${bisa?`<div class="acts">
      ${j.status==='Antri'?'<button class="btn dark" data-st="Dikerjakan">▶ Mulai kerjakan</button>':''}
      ${j.status==='Dikerjakan'?'<button class="btn green" data-st="Selesai">✓ Selesai</button><button class="btn red" data-st="Gagal">✕ Gagal / tidak bisa</button>':''}
      ${(j.status==='Selesai'||j.status==='Gagal')?'<button class="btn sm" data-st="Dikerjakan">↺ Kerjakan lagi</button>':''}
    </div>`:''}
  </div>`;
}
function partRow(p,bisa){ return `<div class="pr"><input data-pn placeholder="Nama part" value="${esc(p.nama||'')}" ${bisa?'':'disabled'}><input data-pv inputmode="numeric" placeholder="Rp" value="${p.nominal?Number(p.nominal).toLocaleString('id-ID'):''}" ${bisa?'':'disabled'}>${bisa?'<button class="btn sm red" data-delpart type="button">✕</button>':'<span></span>'}</div>`; }
function collect(el){
  const v = f => { const x = el.querySelector(`[data-f="${f}"]`); return x ? x.value : undefined; };
  const lines = t => (t||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const o = { catatanKerusakan:v('catatanKerusakan'), hasil:v('hasil'), fotoSebelum:lines(v('fotoSebelum')), fotoSesudah:lines(v('fotoSesudah')),
    parts:[...el.querySelectorAll('.pr')].map(r=>({nama:r.querySelector('[data-pn]').value, nominal:Number(r.querySelector('[data-pv]').value.replace(/\D/g,''))||0})) };
  if(v('alasanGagal')!==undefined) o.alasanGagal = v('alasanGagal');
  const bad = o.fotoSebelum.concat(o.fotoSesudah).filter(x=>!/^https?:\/\//i.test(x));
  if(bad.length){ toast('Link foto harus diawali http:// atau https://'); return null; }
  return o;
}
function wireJob(j){
  const el = document.getElementById('j-'+j.id); if(!el) return;
  const det = el.querySelector('[data-det]'); if(det) det.ontoggle = () => { det.open ? OPEN.add(j.id) : OPEN.delete(j.id); };
  const add = el.querySelector('[data-addpart]'); if(add) add.onclick = () => { el.querySelector('[data-parts]').insertAdjacentHTML('beforeend', partRow({},true)); wireParts(el); };
  wireParts(el);
  const sv = el.querySelector('[data-save]'); if(sv) sv.onclick = async () => { const o = collect(el); if(!o) return; sv.disabled = true;
    try{ await api('/tapi/jobs/'+j.id, o); toast('Laporan disimpan'); await loadJobs(); }catch(e){ if(e.message!=='401') toast(e.message); } sv.disabled = false; };
  el.querySelectorAll('[data-st]').forEach(b => b.onclick = async () => {
    const st = b.dataset.st;
    if(st==='Gagal' && !confirm('Tandai pekerjaan ini GAGAL / tidak bisa diperbaiki?')) return;
    if(st==='Selesai' && !confirm('Tandai pekerjaan ini SELESAI?')) return;
    const o = det && det.open ? collect(el) : {}; if(o===null) return;
    b.disabled = true;
    try{ await api('/tapi/jobs/'+j.id, Object.assign(o, {status:st})); toast('Status: '+st); if(st==='Gagal'){ OPEN.add(j.id); } await loadJobs(); }
    catch(e){ if(e.message!=='401') toast(e.message); b.disabled = false; }
  });
}
function wireParts(el){
  el.querySelectorAll('[data-delpart]').forEach(b=>b.onclick=()=>b.closest('.pr').remove());
  el.querySelectorAll('[data-pv]').forEach(i=>i.oninput=()=>{ const d=i.value.replace(/\D/g,''); i.value = d ? Number(d).toLocaleString('id-ID') : ''; });
}
function typing(){ const a=document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName); }
setInterval(async () => {
  if(!ME || document.hidden || typing() || MODAL) return;
  try{ const j = await api('/tapi/jobs'); if(j.version !== VER){ const baru = j.jobs.filter(x=>!JOBS.some(y=>y.id===x.id)).length; JOBS=j.jobs; VER=j.version; render(); if(baru) toast(baru+' pekerjaan baru dari owner'); } }catch(_){}
}, 8000);
(async () => { try{ const m = await api('/tapi/me'); if(m.loggedIn){ ME=m.akun; await loadJobs(); } else renderLogin(); }catch(e){ if(e.message!=='401') renderLogin('Server teknisi belum siap. Coba lagi sebentar.'); } })();
</script>
</body>
</html>
